name: Android APK (Capacitor)

# Builds the Capacitor Android shell in mobile/ into an installable debug APK on
# a Linux runner (Android debug APKs can be sideloaded without signing secrets).
# Add a keystore to produce a signed release APK for the Play Store.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (generated on this runner)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Add Android permissions (camera, mic, notifications)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys
          path = sys.argv[1]
          xml = open(path, encoding="utf-8").read()
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.POST_NOTIFICATIONS",
          ]
          lines = "".join(
              f'    <uses-permission android:name="{p}"/>\n' for p in perms
              if f'android:name="{p}"' not in xml
          )
          if lines:
              xml = xml.replace("    <application", lines + "    <application", 1)
              open(path, "w", encoding="utf-8").write(xml)
          print("permissions now:", [p for p in perms if p in xml])
          PY

      - name: Sync web assets and native dependencies
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZChat-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
