<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Z Admin Console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "DM Sans", "Space Grotesk", "Segoe UI", system-ui, sans-serif; background: oklch(0.145 0.011 195); color: oklch(0.955 0.006 160); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: oklch(0.68 0.015 185); font-size: 13px; margin-bottom: 22px; }
  .card { background: oklch(0.19 0.011 194); border: 1px solid oklch(0.3 0.013 193); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: oklch(0.78 0.01 190); text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .svc { display: flex; align-items: center; gap: 8px; background: oklch(0.165 0.011 194); border: 1px solid oklch(0.3 0.013 193); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e5484d; flex: none; }
  .dot.ok { background: #46a758; }
  .dot.warn { background: oklch(0.75 0.16 70); }
  .name { flex: 1; font-weight: 600; }
  .st { color: oklch(0.68 0.015 185); font-size: 12px; }
  pre { background: oklch(0.165 0.011 194); border: 1px solid oklch(0.3 0.013 193); border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 380px; color: oklch(0.88 0.008 185); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: oklch(0.215 0.012 195); color: oklch(0.955 0.006 160); border: 1px solid oklch(0.33 0.013 193); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { background: oklch(0.25 0.013 195); }
  button.primary { background: oklch(0.86 0.15 92); border-color: oklch(0.86 0.15 92); color: oklch(0.16 0.03 90); }
  button.primary:hover { background: oklch(0.78 0.17 88); border-color: oklch(0.78 0.17 88); }
  input { width: 100%; background: oklch(0.165 0.011 194); border: 1px solid oklch(0.3 0.013 193); border-radius: 10px; padding: 10px 12px; color: oklch(0.955 0.006 160); font-size: 14px; margin-bottom: 10px; }
  .muted { color: oklch(0.68 0.015 185); font-size: 12px; }
  .msg { color: #f5a524; font-size: 13px; min-height: 18px; margin: 6px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; font-size: 12px; white-space: pre-wrap; color: oklch(0.88 0.008 185); }
  a { color: oklch(0.86 0.15 92); }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Z Admin Console</h1>
  <div class="sub">black box ops · access.z-chat.men</div>

  <div class="card" id="loginCard">
    <h2>Sign in (admin only)</h2>
    <button class="primary" id="oauthBtn" style="width:100%;padding:11px 14px">Sign in with Z Chat</button>
    <div class="muted" style="margin:14px 0 10px;text-align:center">or use email + password</div>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div class="msg" id="loginMsg"></div>
    <button class="primary" id="loginBtn">Sign in</button>
  </div>

  <div id="dash" class="hide">
    <div class="card">
      <h2>Services <span class="muted" id="healthTime"></span></h2>
      <div class="grid" id="services"></div>
    </div>
    <div class="card">
      <h2>Quick actions</h2>
      <div class="row">
        <button data-restart="zchat">Restart Z Chat</button>
        <button data-restart="zslides">Restart Z Slides</button>
        <button data-restart="zbox">Restart zbox MCP</button>
        <button data-restart="zmedia">Restart Z Media</button>
        <button id="refreshBtn">Refresh</button>
      </div>
      <div class="msg" id="actionMsg"></div>
    </div>
    <div class="card">
      <h2>System</h2>
      <div class="stats" id="sysStats"></div>
    </div>
    <div class="card">
      <h2>z-chat deploy log (last 40)</h2>
      <pre id="deployLog">loading…</pre>
    </div>
    <div class="card">
      <h2>Handy links</h2>
      <div class="muted">
        <a href="https://z-chat.men/admin" target="_blank">Z Chat admin</a> ·
        <a href="https://z-chat.men/admin/applications" target="_blank">Applications</a> ·
        <a href="https://z-chat.men/admin/reports" target="_blank">Reports</a> ·
        <a href="https://z-chat.men/admin/users" target="_blank">Users</a> ·
        <a href="https://present.z-chat.men" target="_blank">Z Slides</a>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="logoutBtn">Sign out</button>
      </div>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const H = { "x-zc": "console" };

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...H, "Content-Type": "application/json", ...(opts.headers || {}) } });
    return { status: res.status, body: await res.json().catch(() => ({})) };
  }

  function dotClass(state) {
    if (state === "active") return "dot ok";
    if (state === "activating" || state === "reloading" || state === "deactivating") return "dot warn";
    return "dot";
  }

  async function loadHealth() {
    const { body } = await api("/api/health");
    $("services").innerHTML = "";
    for (const s of body.services || []) {
      const el = document.createElement("div");
      el.className = "svc";
      el.innerHTML = `<span class="${dotClass(s.active)}"></span><span class="name"></span><span class="st"></span>`;
      el.querySelector(".name").textContent = s.unit;
      el.querySelector(".st").textContent = s.active;
      $("services").appendChild(el);
    }
    $("healthTime").textContent = body.time ? "· " + new Date(body.time).toLocaleTimeString() : "";
    $("sysStats").textContent =
      `memory\n${body.mem || ""}\n\n${body.uptime || ""}\n\ndisk\n${body.disk || ""}\n\nblackscan frozen lines: ${body.frozenCount || "n/a"}`;
  }

  async function loadDeploy() {
    const { body } = await api("/api/deploy");
    $("deployLog").textContent = (body.lines || []).join("\n") || "(empty)";
  }

  async function showDash() {
    $("loginCard").classList.add("hide");
    $("dash").classList.remove("hide");
    await Promise.all([loadHealth(), loadDeploy()]);
  }

  $("loginBtn").onclick = async () => {
    $("loginMsg").textContent = "";
    const { status, body } = await api("/api/login", {
      method: "POST",
      body: JSON.stringify({ email: $("email").value, password: $("password").value }),
    });
    if (status !== 200) return ($("loginMsg").textContent = body.error || "Login failed");
    await showDash();
  };
  $("oauthBtn").onclick = () => { location.href = "/auth/login"; };
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
  $("refreshBtn").onclick = () => { loadHealth(); loadDeploy(); };
  $("logoutBtn").onclick = async () => { await api("/api/logout", { method: "POST" }); location.reload(); };
  document.querySelectorAll("[data-restart]").forEach((btn) => {
    btn.onclick = async () => {
      const target = btn.getAttribute("data-restart");
      $("actionMsg").textContent = `restarting ${target}…`;
      const { status, body } = await api("/api/restart", { method: "POST", body: JSON.stringify({ target }) });
      $("actionMsg").textContent = status === 200 ? `${target} restarted` : `failed: ${body.err || body.error || "error"}`;
      setTimeout(loadHealth, 3000);
    };
  });

  (async () => {
    const { body } = await api("/api/me");
    if (body.admin) await showDash();
  })();
</script>
</body>
</html>
